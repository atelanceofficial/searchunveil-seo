name: Reference links

# Findings cite primary sources. This confirms every cited address still resolves.
on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - packages/core/src/references.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check cited sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check every reference URL
        run: node scripts/check-links.ts
