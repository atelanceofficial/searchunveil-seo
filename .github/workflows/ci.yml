name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (install scripts disabled by .npmrc)
        run: npm ci
      - name: Text, format, lint, types, tests with coverage
        run: npm run check
      - name: Production build
        run: npm run build

  container:
    name: Server image (build, start, answer)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t searchunveil .
      - name: Start it and check that it answers, serves the app and refuses private addresses
        run: |
          docker run -d --name searchunveil -p 8080:8080 searchunveil
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"fetch":true'
          curl -fsS http://127.0.0.1:8080/ | grep -q "connect-src 'self'"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"address":"http://169.254.169.254/"}' http://127.0.0.1:8080/api/page)
          test "$status" = 400
      - name: Show the server's log when it fails
        if: failure()
        run: docker logs searchunveil

  browser:
    name: Browser tests (accessibility, security policy, user flows)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against the production build
        run: npm run test:e2e -- --trace off
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
